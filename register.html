<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes">
  <title>BrightBot - Register</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="auth.css"/>
  <link rel="stylesheet" href="mobile.css"/>
    <style>
    body { overflow: auto !important; height: auto !important; min-height: 100dvh !important; background: #1a1a2e !important; }
    .auth-page { min-height: 100dvh !important; width: 100vw !important; display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; padding: 24px 16px !important; box-sizing: border-box !important; background: #1a1a2e !important; }
    .auth-box { width: 100% !important; max-width: 400px !important; box-sizing: border-box !important; }
  </style>
  <link rel="icon" type="image/x-icon" href="Images/brightbot-icon.ico">
  <link rel="icon" type="image/svg+xml" href="Images/brightbot-icon.svg">
  <link rel="apple-touch-icon" href="Images/brightbot-icon-192.png">
</head>
<body>

<div class="auth-page">
  <div class="auth-box">
    <div class="auth-brand">
      <div class="brand-icon">B</div>
      <span class="brand-name">BrightBot</span>
    </div>
    <h2>Create Account</h2>
    <p class="auth-sub">Sign up to get started</p>
    <div id="error-message" class="auth-error hidden"></div>
    <div class="auth-form">
      <input type="text"     id="username" placeholder="Choose a username"
             autocomplete="username" autocapitalize="none" autocorrect="off"/>
      <input type="email"    id="email"    placeholder="Your email address"
             autocomplete="email" autocapitalize="none"/>
      <input type="password" id="password" placeholder="Choose a password (min 6 characters)"
             autocomplete="new-password"/>
      <button id="registerBtn">Create Account</button>
    </div>
    <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
  </div>
</div>

<script>
  document.getElementById("password").addEventListener("keydown", function(e) {
    if (e.key === "Enter") document.getElementById("registerBtn").click();
  });
  document.getElementById("username").addEventListener("keydown", function(e) {
    if (e.key === "Enter") document.getElementById("email").focus();
  });
  document.getElementById("email").addEventListener("keydown", function(e) {
    if (e.key === "Enter") document.getElementById("password").focus();
  });
  document.getElementById("registerBtn").addEventListener("click",function(){
    var u=document.getElementById("username").value.trim();
    var e=document.getElementById("email").value.trim();
    var p=document.getElementById("password").value;
    var err=document.getElementById("error-message");
    err.classList.add("hidden");
    if(!u||!e||!p){err.textContent="Please fill in all fields.";err.classList.remove("hidden");return;}
    fetch("auth.php",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"register",username:u,email:e,password:p})})
    .then(function(r){return r.json();})
    .then(function(data){
      if(data.success){window.location.href="index.html";}
      else{err.textContent=data.error||"Registration failed.";err.classList.remove("hidden");}
    })
    .catch(function(){err.textContent="Could not connect to server. Please try again.";err.classList.remove("hidden");});
  });

</script>

</body>
</html>
